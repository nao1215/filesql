version: "2"
run:
  go: "1.25"
linters:
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - copyloopvar
    - decorder
    - dogsled
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoinits
    - goconst
    - gomoddirectives
    - gosec
    - interfacebloat
    - intrange
    - makezero
    - mirror
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - tagliatelle
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  disable:
    # staticcheck builds SSA and computes facts for every package in the import
    # graph, and this module's graph holds machine-generated Go with functions
    # thousands of lines long: modernc.org/sqlite/lib alone has one of 7,517
    # lines. Analysis cost grows faster than linearly with function size, so the
    # run takes tens of minutes while every other linter here finishes in
    # seconds. It fits in the cache most of the time, but any change to go.sum
    # invalidates it and the job then exceeds even a thirty-minute limit, which
    # is why every dependency update failed lint for a reason unrelated to its
    # diff. govet stays enabled and covers the overlapping checks.
    - staticcheck

  settings:
    goconst:
      # A literal repeated across test cases is not a constant the package is
      # missing, and counting them pushed production strings over the threshold.
      ignore-tests: true
    errcheck:
      disable-default-exclusions: false
      check-type-assertions: true
      check-blank: true
    tagliatelle:
      case:
        rules:
          json: snake
        use-field-name: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - goconst
        path: .*_test\.go
      - linters:
          - errcheck
        source: defer
      - linters:
          - gochecknoinits
        path: filesql\.go
        source: func init\(\)
      - path: (.+)\.go$
        text: fmt.Fprintf
      - path: (.+)\.go$
        text: fmt.Fprintln
      - path: (.+)\.go$
        text: fmt.Fprint
      - path: (.+)\.go$
        text: fmt.Printf
      - path: (.+)\.go$
        text: fmt.Sscanf
      - path: (.+)\.go$
        text: buf.WriteByte
      - path: (.+)\.go$
        text: buf.WriteRune
      - path: (.+)\.go$
        text: Close
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
