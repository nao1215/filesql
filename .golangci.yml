version: "2"
run:
  go: "1.25"
linters:
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - copyloopvar
    - decorder
    - dogsled
    - durationcheck
    - errchkjson
    - errname
    - errorlint
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoinits
    - goconst
    - gomoddirectives
    - gosec
    - interfacebloat
    - intrange
    - makezero
    - mirror
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - nosprintfhostport
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sloglint
    - sqlclosecheck
    - tagliatelle
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  disable:
    # staticcheck builds SSA and computes facts for every package in the import
    # graph, and this module's graph holds machine-generated Go: the single
    # largest function in modernc.org/sqlite/lib is 7,517 lines long, with two
    # more past 2,400. Analysis cost grows faster than linearly with function
    # size, so the run takes tens of minutes while every other linter here
    # finishes in seconds. It fits in golangci-lint's cache most of the time,
    # but any change to go.sum invalidates that cache and the run then exceeds
    # even a thirty-minute limit, which is why every dependency update failed
    # lint for a reason unrelated to its diff.
    #
    # This disables it for `make lint` as well as for CI, which is deliberate: a
    # lint that takes twelve minutes locally is a lint nobody runs. govet stays
    # enabled and covers what the two have in common. The checks staticcheck
    # adds on top are taken back by a workflow that runs it off the pull request
    # path, plus a make target for running it on purpose.
    - staticcheck

  settings:
    goconst:
      # A literal repeated across test cases is not a constant the package is
      # missing, and counting them pushed production strings over the threshold.
      ignore-tests: true
    errcheck:
      disable-default-exclusions: false
      check-type-assertions: true
      check-blank: true
    tagliatelle:
      case:
        rules:
          json: snake
        use-field-name: true
  exclusions:
    generated: lax
    rules:
      - linters:
          - goconst
        path: .*_test\.go
      # The dialect tables are data: a SQL type or helper name spelled in three
      # of them is three entries in three tables, not a constant the package is
      # missing, and a map whose keys are constants cannot be read.
      - linters:
          - goconst
        path: dialect/internal/lower/(cast_targets|helper_names|type_names|unsupported_functions)\.go
      # The syntax tree's marker and position methods are one line each and
      # mechanical: a doc comment on every one of them would be a hundred
      # repetitions of one sentence, and the sentence is written once above the
      # run.
      - linters:
          - revive
        path: dialect/internal/ast/.*\.go
        text: should have comment or be unexported
      - linters:
          - errcheck
        source: defer
      - linters:
          - gochecknoinits
        path: filesql\.go
        source: func init\(\)
      - path: (.+)\.go$
        text: fmt.Fprintf
      - path: (.+)\.go$
        text: fmt.Fprintln
      - path: (.+)\.go$
        text: fmt.Fprint
      - path: (.+)\.go$
        text: fmt.Printf
      - path: (.+)\.go$
        text: fmt.Sscanf
      - path: (.+)\.go$
        text: buf.WriteByte
      - path: (.+)\.go$
        text: buf.WriteRune
      - path: (.+)\.go$
        text: Close
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
