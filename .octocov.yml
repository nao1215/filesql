# generated by octocov init
coverage:
  if: true
  # The module is at 93.2% (2026-11-27). A pull request may not lower it, and
  # the total may not fall below 93%. A statement no test reaches is one no
  # test can catch a mutant in either. What is left is spread over the dialect
  # parser and renderer, the ACH converter and the readers' error handling,
  # and 99% is not reached yet.
  #
  # Three error branches are reached or not depending on when a canceled
  # context lands in a load or a dump: the Scan check of the dump loop in
  # filesql.go, which scanning into any fails only for rows closed under it,
  # and the two prepare failures in stream_processor.go, which nothing but the
  # context fails. The total moves by about 0.01% between runs of the same
  # code, and the diff allows 0.1% for that; a real drop is larger.
  acceptable: current >= 93% && diff >= -0.1%
  exclude:
    - "github.com/nao1215/filesql/examples/**/*.go"
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
comment:
  if: is_pull_request
  hideFooterLink: false
summary:
  if: true
report:
  if: is_default_branch
  datastores:
    - artifact://${GITHUB_REPOSITORY}
