# Version updates arrive once a month, one pull request per entry below.
# Each group applies to version updates only. Security updates are switched on
# in the repository settings, not here; where they are on, Dependabot opens
# them as advisories appear, outside this schedule and these groups.
version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      gomod:
        applies-to: version-updates
        patterns:
          - "*"
  # The example modules pin a released filesql and their own drivers and ORMs.
  # Nothing else watches them: the root scan above does not reach a separate
  # module, and govulncheck deliberately does not build them, because their
  # source tracks the released API rather than this checkout. They are grouped
  # so a month's updates arrive as one pull request rather than one per
  # dependency.
  - package-ecosystem: gomod
    directories:
      - "/examples/basic"
      - "/examples/bun"
      - "/examples/ent"
      - "/examples/gorm"
      - "/examples/multi-format"
      - "/examples/sqlc"
      - "/examples/sqlx"
      - "/examples/squirrel"
    schedule:
      interval: monthly
    open-pull-requests-limit: 8
    groups:
      examples:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
