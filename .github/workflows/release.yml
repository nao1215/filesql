name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # A tag reaches this workflow having passed nothing: the pull request checks
  # ran against the branch, and a tag can be pushed onto any commit at all,
  # including one that was never in a pull request. So everything the branch is
  # asked for is asked again here, and nothing is published until it passes.
  #
  # This job keeps the workflow's read-only token. It runs third-party actions
  # and the module's own tests, and neither should be able to reach a token that
  # can write to the repository; creating the release is a separate job for
  # exactly that reason.
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"

      # First, because it is the cheapest and because it is the check most
      # likely to fail: a tag that is not SemVer, or one whose version has no
      # changelog entry, is refused here rather than published with a
      # placeholder body. See .github/scripts/release-metadata.sh, whose
      # behavior is pinned by release_metadata_test.go.
      - name: Validate the tag and extract its changelog entry
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: ./.github/scripts/release-metadata.sh "$TAG_NAME"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          args: --config .golangci.yml --timeout 10m

      # The examples are separate modules pinned to a released filesql, so the
      # test run above never compiles them. They are what the README sends
      # people to, and a release that breaks them breaks the documentation with
      # it.
      - name: Examples
        run: ./examples/verify.sh

  # The only job that can write to the repository, and the only thing it does is
  # create the release. The tag is validated and its body extracted again here
  # rather than carried over from the job above, because that is two seconds of
  # awk and it keeps the write-capable job from having to trust an output.
  release:
    name: Create the release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract the changelog entry for this tag
        id: meta
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: ./.github/scripts/release-metadata.sh "$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.meta.outputs.body_path }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
