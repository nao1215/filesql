name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # A tag reaches this workflow having passed nothing: the pull request checks
  # ran against the branch, and a tag can be pushed onto any commit at all,
  # including one that was never in a pull request. So everything the branch is
  # asked for is asked again here, and nothing is published until it passes.
  #
  # This job keeps the workflow's read-only token. It runs third-party actions
  # and the module's own tests, and neither should be able to reach a token that
  # can write to the repository; creating the release is a separate job for
  # exactly that reason.
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.9"

      # First, because it is the cheapest and because it is the check most
      # likely to fail: a tag that is not SemVer, or one whose version has no
      # changelog entry, is refused here rather than published with a
      # placeholder body. See .github/scripts/release-metadata.sh, whose
      # behavior is pinned by release_metadata_test.go.
      - name: Validate the tag and extract its changelog entry
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: ./.github/scripts/release-metadata.sh "$TAG_NAME"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --config .golangci.yml --timeout 10m

      # The examples are separate modules pinned to a released filesql, so the
      # test run above never compiles them. They are what the README sends
      # people to, and a release that breaks them breaks the documentation with
      # it.
      - name: Examples
        run: ./examples/verify.sh

  # The only job that can write to the repository. It creates the release and
  # attaches the signed source archive, checksums and provenance to it. The tag is validated and its body extracted again here
  # rather than carried over from the job above, because that is two seconds of
  # awk and it keeps the write-capable job from having to trust an output.
  release:
    name: Create the release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload assets
      id-token: write # keyless cosign signing and provenance (OIDC)
      attestations: write # publish build provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract the changelog entry for this tag
        id: meta
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: ./.github/scripts/release-metadata.sh "$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.meta.outputs.body_path }}
          # Stays a draft until the signed assets are uploaded (last step).
          draft: true
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Signed-Releases: attach a source archive, its checksums, a keyless cosign
      # signature of the checksums and the build provenance of the archive to
      # the release. The release procedure itself is unchanged.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Build the source archive and checksums
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="filesql-${TAG_NAME}/" -o "dist/filesql-${TAG_NAME}.tar.gz" "$TAG_NAME"
          cd dist
          sha256sum "filesql-${TAG_NAME}.tar.gz" > checksums.txt

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/filesql-${{ github.ref_name }}.tar.gz

      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Upload the signed assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          jq -c . < "$BUNDLE_PATH" > "dist/filesql-${TAG_NAME}.intoto.jsonl"
          gh release upload "$TAG_NAME" \
            "dist/filesql-${TAG_NAME}.tar.gz" \
            dist/checksums.txt \
            dist/checksums.txt.sigstore.json \
            "dist/filesql-${TAG_NAME}.intoto.jsonl" \
            --clobber

      # Publishing with GITHUB_TOKEN does not start another workflow run.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release edit "$TAG_NAME" --draft=false
