name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit_test:
    name: Unit test (linux)

    strategy:
      matrix:
        platform: [ubuntu-latest]

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 10

    steps:
      # The module's own tests run in this job, so the checkout leaves no
      # credential in .git/config for them to reach. No workflow-level
      # permissions block goes with it: octocov comments on the pull request and
      # reads and writes an artifact datastore, so a contents-read-only token
      # would take away what this job is here to do.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          # Pinned rather than floating on "1": the baseline this module
          # states is Go 1.25.13, and 1.26.6 is the 1.26 release carrying the
          # same standard library fixes.
          go-version: "1.26.6"

      - name: Run tests with coverage report output
        run: go test -cover -coverpkg=./... -coverprofile=coverage.out ./...

      - uses: k1LoW/octocov-action@v1
