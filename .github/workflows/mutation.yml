name: Mutation
# Mutation testing rewrites one expression at a time and checks that a test
# fails. It reruns a package's tests once per mutant, so it is too slow for
# every pull request: the full run is weekly, and pull requests mutate only the
# lines they change (gremlins --diff, run from the module root so the paths
# that git diff prints match the files gremlins mutates).
#
# The module has about 7,700 mutants, most of them in the dialect runtime and
# the root package, so the weekly run is split by package into jobs that each
# finish inside the timeout. The scores measured when this was added are in
# doc/testing.md.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
  pull_request:
    paths:
      - '**.go'
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GREMLINS_VERSION: v0.6.0

jobs:
  diff:
    name: Mutate the changed lines
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install gremlins
        run: go install "github.com/go-gremlins/gremlins/cmd/gremlins@${GREMLINS_VERSION}"
      - name: Mutate the lines this pull request changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Run from the module root: gremlins compares git diff paths as given.
        # Zero context lines give each edit its own hunk; with git's default
        # three, two edits a few lines apart merge into one hunk whose range
        # gremlins reads short, and the later edit is never mutated.
        run: |
          git config diff.context 0
          gremlins unleash --diff "$BASE_SHA" --workers 2 --timeout-coefficient 10 --output mutation.json .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report-diff
          path: mutation.json
          if-no-files-found: ignore

  full:
    name: Mutate ${{ matrix.package }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        package:
          - .
          - ./dialect
          - ./dialect/internal/runtime
          - ./dialect/internal/parser
          - ./dialect/internal/lower
          - ./dialect/internal/token
          - ./dialect/internal/render
          - ./internal/reader
          - ./internal/parser
          - ./internal/parser/ach
          - ./internal/parser/wire
          - ./internal/infer
          - ./internal/codec
          - ./internal/textin
          - ./internal/writer
          - ./internal/atomicwrite
          - ./prep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install gremlins
        run: go install "github.com/go-gremlins/gremlins/cmd/gremlins@${GREMLINS_VERSION}"
      - name: Mutate the package
        env:
          PACKAGE: ${{ matrix.package }}
        # gremlins mutates everything under the path it is given and matches
        # --exclude-files against paths relative to it, so excluding any path
        # with a slash keeps each job to its own directory; the packages below
        # it have jobs of their own.
        run: gremlins unleash --workers 4 --timeout-coefficient 10 --exclude-files '/' --output mutation.json "$PACKAGE"
      - name: Name the report after the package
        id: report
        env:
          PACKAGE: ${{ matrix.package }}
        run: echo "name=mutation-report-$(echo "$PACKAGE" | tr -c 'A-Za-z0-9\n' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ steps.report.outputs.name }}
          path: mutation.json
          if-no-files-found: ignore
