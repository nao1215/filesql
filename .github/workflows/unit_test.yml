name: MultiPlatformUnitTest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit_test:
    name: Unit test

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        # Pinned to the patch releases that carry the standard library fixes
        # this module's baseline requires: GO-2026-6088 (encoding/xml) and
        # GO-2026-5972 (encoding/asn1) are fixed in 1.25.13 and 1.26.6. A
        # floating "1.25" would happily test on a Go the go.mod directive
        # already refuses to vouch for.
        go:
          - "1.25.13"
          - "1.26.6"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run tests with coverage report output
        run: go test -cover -coverpkg=./... -coverprofile=coverage.out ./...

  race_test:
    name: Unit test (race detector)

    # One combination rather than the matrix above. The race detector rebuilds
    # the module and slows every test in it, and what it watches here - the
    # goroutines sharing the *sql.DB that Open returns, and the auto-save
    # connector's anchor connection - is the same Go code on every operating
    # system, so a second platform would buy repetition rather than coverage.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.13"

      - name: Run tests with the race detector
        run: go test -race ./...
