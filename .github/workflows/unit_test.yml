name: MultiPlatformUnitTest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel the superseded run of a pull request when it is pushed again; runs
# on main are grouped by commit so none of them is ever canceled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit_test:
    name: Unit test

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        # Pinned to the patch releases that carry the standard library fixes
        # this module's baseline requires: GO-2026-6088 (encoding/xml) and
        # GO-2026-5972 (encoding/asn1) are fixed in 1.26.6, and the reachable
        # net/http advisories GO-2026-6603 and GO-2026-6611..6617 in 1.26.9, and
        # GO-2026-6859 (net/http) in 1.26.11. A
        # floating "1.26" would happily test on a Go the go.mod directive
        # already refuses to vouch for.
        # The ceiling is "stable" rather than a pinned newest. Without a ceiling
        # nothing here would notice a new Go changing behavior this module
        # depends on -- adding one is what surfaced the JSON read bound -- and a
        # pinned one stops being the newest the day after it is written, which
        # is the same blind spot with a later start date. "stable" and not "1":
        # setup-go resolves "1" from its own manifest, which lagged 1.27.0 by
        # weeks and would have run this leg on the version below it.
        go:
          - "1.26.11"
          - "stable"
        # macOS runners are shared five at a time across the account and were
        # what a pull request waited on longest. A pull request tests macOS on
        # the newest Go only; the push to main runs both legs there.
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"macos-latest","go":"1.26.11"}]') || fromJSON('[]') }}
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Run tests with coverage report output
        run: go test -cover -coverpkg=./... -coverprofile=coverage.out ./...

  race_test:
    name: Unit test (race detector)

    # One combination rather than the matrix above. The race detector rebuilds
    # the module and slows every test in it, and what it watches here - the
    # goroutines sharing the *sql.DB that Open returns, and the auto-save
    # connector's anchor connection - is the same Go code on every operating
    # system, so a second platform would buy repetition rather than coverage.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-go's cache holds the build without -race, which is of no use
      # here: the race build of the transpiled SQLite driver was most of this
      # job's time. The job keeps its own build cache, saved from main and
      # restored on pull requests. The key is the Go version and go.sum, not
      # the commit: a per-commit key saved a new 400 MB entry on every push to
      # main and filled the repository's 10 GB cache quota. main saves only
      # when the exact key is missing, so the entry is refreshed when go.sum
      # or the Go version changes.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with:
          go-version: "1.26.11"
          cache: false

      - name: Restore the race build cache
        id: race-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-race-go${{ steps.go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-race-go${{ steps.go.outputs.go-version }}-

      - name: Run tests with the race detector
        run: go test -race ./...

      - name: Save the race build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.race-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.race-cache.outputs.cache-primary-key }}

  cross_build:
    name: Cross build (${{ matrix.goos }})

    # The test legs above run on the three operating systems GitHub hosts
    # runners for, which leaves the BSDs untested in the one way that is cheap
    # to test: whether the module compiles there at all. It does today, and a
    # library that imports a database driver built out of transpiled C is one
    # dependency bump away from that stopping being true. A leg is seconds and
    # produces no binary; a build failure here is a failure for anyone running
    # FreeBSD who imports filesql, and it would otherwise surface in their
    # build rather than in this repository's.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows, freebsd, openbsd, netbsd]

    env:
      GOOS: ${{ matrix.goos }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Build
        run: go build ./...
