name: MultiPlatformUnitTest

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit_test:
    name: Unit test

    strategy:
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
        # Pinned to the patch releases that carry the standard library fixes
        # this module's baseline requires: GO-2026-6088 (encoding/xml) and
        # GO-2026-5972 (encoding/asn1) are fixed in 1.26.6. A
        # floating "1.26" would happily test on a Go the go.mod directive
        # already refuses to vouch for.
        # The ceiling is "stable" rather than a pinned newest. Without a ceiling
        # nothing here would notice a new Go changing behavior this module
        # depends on -- adding one is what surfaced the JSON read bound -- and a
        # pinned one stops being the newest the day after it is written, which
        # is the same blind spot with a later start date. "stable" and not "1":
        # setup-go resolves "1" from its own manifest, which lagged 1.27.0 by
        # weeks and would have run this leg on the version below it.
        go:
          - "1.26.6"
          - "stable"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run tests with coverage report output
        run: go test -cover -coverpkg=./... -coverprofile=coverage.out ./...

  race_test:
    name: Unit test (race detector)

    # One combination rather than the matrix above. The race detector rebuilds
    # the module and slows every test in it, and what it watches here - the
    # goroutines sharing the *sql.DB that Open returns, and the auto-save
    # connector's anchor connection - is the same Go code on every operating
    # system, so a second platform would buy repetition rather than coverage.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"

      - name: Run tests with the race detector
        run: go test -race ./...

  cross_build:
    name: Cross build (${{ matrix.goos }})

    # The test legs above run on the three operating systems GitHub hosts
    # runners for, which leaves the BSDs untested in the one way that is cheap
    # to test: whether the module compiles there at all. It does today, and a
    # library that imports a database driver built out of transpiled C is one
    # dependency bump away from that stopping being true. A leg is seconds and
    # produces no binary; a build failure here is a failure for anyone running
    # FreeBSD who imports filesql, and it would otherwise surface in their
    # build rather than in this repository's.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows, freebsd, openbsd, netbsd]

    env:
      GOOS: ${{ matrix.goos }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"

      - name: Build
        run: go build ./...
