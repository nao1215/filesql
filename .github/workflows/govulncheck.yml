name: govulncheck

# Vulnerability scanning runs on every pull request and on main, unlike
# staticcheck: govulncheck loads the vulnerability database and analyzes call
# graphs, which finishes in under a minute on this module, so there is no reason
# to keep it off the path a change takes to get merged. What it catches is a
# dependency — or a standard library — that has grown a known advisory since the
# last time anybody looked, which is exactly the thing nobody looks for on their
# own.
#
# The database changes every day, so a scan that passed at merge time can fail
# tomorrow without a line of this module changing. The pull_request/push legs
# catch a newly added dependency; the daily schedule catches a newly published
# advisory against the dependencies already in go.sum, which would otherwise
# go unnoticed until the next pull request happened to run the scan.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Both supported Go lines, because govulncheck reports on the standard
    # library of whichever Go builds the module. Scanning with 1.26.9 alone
    # would say nothing about an advisory that only affects the newest Go,
    # which this module supports and which some callers will be building it with.
    strategy:
      matrix:
        go:
          - "1.26.9"
          - "stable"
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      # Pinned rather than @latest: a scanner that changes under the project
      # turns an unrelated pull request red for a reason nobody in it can act
      # on, and a pinned version makes the run reproducible from the commit.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # ACCEPTED lists advisories this module reaches and defends against on
      # its own side. Each is fixed upstream only in commits after excelize
      # v2.11.0, the latest tag, so no released version clears them. Remove an
      # ID once a tagged excelize carries its fix.
      #   GO-2026-6684, GO-2026-6689: OLE/CFB (encrypted workbook) parsing.
      #     OpenWorkbook refuses anything that is not a ZIP archive before
      #     calling excelize (TestOpenWorkbookRejectsCompoundFileBeforeExcelize).
      #   GO-2026-6685: unbounded row numbers in Rows/GetRows. Sheets are
      #     checked against Excel's row limit before GetRows
      #     (TestWorkbookRejectsOversizedRowAfterValidRow).
      #   GO-2026-6688: recursion in calc.go's array formulas. The advisory
      #     names no symbols, so any call is flagged, but filesql reads cached
      #     cell values and never calls CalcCellValue.
      # Any other reachable advisory fails the job and prints the text report.
      # pipefail and the record-count check keep a failed or empty scan from
      # reading as "nothing found".
      - name: Scan the module
        env:
          ACCEPTED: GO-2026-6684 GO-2026-6685 GO-2026-6688 GO-2026-6689
        run: |
          set -o pipefail
          govulncheck -format json ./... > "$RUNNER_TEMP/govulncheck.json"
          jq -e -s 'length > 0' "$RUNNER_TEMP/govulncheck.json" > /dev/null
          jq -r 'select(.finding != null and (.finding.trace[0].function // "") != "") | .finding.osv' \
            "$RUNNER_TEMP/govulncheck.json" | sort -u > "$RUNNER_TEMP/called.txt"
          tr ' ' '\n' <<< "$ACCEPTED" | sed '/^$/d' > "$RUNNER_TEMP/accepted.txt"
          if grep -vxF -f "$RUNNER_TEMP/accepted.txt" "$RUNNER_TEMP/called.txt"; then
            echo "::error::govulncheck found an advisory that is not in ACCEPTED"
            govulncheck ./...
            exit 1
          fi

      # The examples are not scanned here. They are separate modules pinned to a
      # released filesql, so their source matches the released API rather than
      # the working tree's, and between a breaking change and the release that
      # carries it they do not compile against the version they pin -- which is
      # a load failure rather than a finding, and one nothing in the pull
      # request can act on. What the scan was there for, an advisory against a
      # driver or ORM one of them pins, is dependabot's job instead: every
      # example module is listed in .github/dependabot.yml. examples/verify.sh,
      # run by the Examples workflow, is what keeps their source compiling
      # against this checkout.
